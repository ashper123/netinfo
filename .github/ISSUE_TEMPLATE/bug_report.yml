name: Bug Report
description: Create a report to help us fix a bug in netinfo
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 10/11
        - Ubuntu / Debian
        - Fedora / RHEL
        - Arch Linux
        - macOS
    validations:
      required: true
  - type: input
    id: python_version
    attributes:
      label: Python Version
      placeholder: "e.g. 3.10.4"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: "1. Run python netinfo.py --sweep\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
