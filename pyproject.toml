[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netinfo"
version = "2.0.0"
description = "Simple command. Rich information. Modern cross-platform network toolkit CLI & JSON generator."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
keywords = [
    "network",
    "cli",
    "ip",
    "ipv6",
    "wifi",
    "dns",
    "mac-address",
    "arp",
    "ping-sweep",
    "subnet",
    "gateway",
    "sysadmin",
    "devops",
    "diagnostics"
]
authors = [
    { name = "netinfo Contributors", email = "maintainers@netinfo.dev" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
    "Typing :: Typed"
]

[project.urls]
Homepage = "https://github.com/ashper123/netinfo"
Documentation = "https://ashper123.github.io/netinfo/"
Repository = "https://github.com/ashper123/netinfo.git"
Changelog = "https://github.com/ashper123/netinfo/blob/main/CHANGELOG.md"
Tracker = "https://github.com/ashper123/netinfo/issues"
Discussions = "https://github.com/ashper123/netinfo/discussions"

[project.scripts]
netinfo = "netinfo:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 115
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "BLE", "SIM", "PIE", "PLW", "RUF"]
ignore = [
    "BLE001",  # broad exception catches are intentional for cross-platform resilience
    "S110",    # try-except-pass patterns are intentional for cross-platform resilience
    "S603",    # subprocess with list args is safe — no shell injection risk
    "SIM105",  # contextlib.suppress is less readable in some defensive contexts
    "SIM113",  # manual counter used for progress reporting, enumerate not applicable
    "PLW0603", # global cache pattern is intentional for ipconfig output caching
    "PLW1510", # subprocess.run check=False is correct when we check returncode ourselves
    "PLW2901", # loop variable reassignment (line.strip()) is intentional and readable
    "E501",    # long lines in argparse/format strings — acceptable at 115 chars
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["W291", "E501"]  # trailing whitespace is intentional in mock ipconfig/ifconfig fixtures
"tests/test_netinfo.py" = ["S101", "E501"]  # assert expected in tests; long assertion lines are readable as-is

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
